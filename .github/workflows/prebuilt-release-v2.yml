name: Prebuilt Release(v2)

# 通用预编译工作流
# 支持自定义指定任意 Git 仓库、分支、Tag、Commit 或 PR 编号
# 支持自定义编译平台、架构与后端，避免全端编译浪费资源
# 参考 llama.cpp 官方 release.yml 设计

on:
  workflow_dispatch:
    inputs:
      repo_url:
        description: '要编译的仓库 URL（如 https://github.com/ggml-org/llama.cpp）'
        required: true
        default: 'https://github.com/ggml-org/llama.cpp'
        type: string
      ref:
        description: '分支 / Tag / Commit（留空则自动检测）'
        required: false
        default: 'master'
        type: string
      pr_number:
        description: 'PR 编号（如果填写，优先编译该 PR 的 merge commit，repo_url 和 ref 将被覆盖）'
        required: false
        default: ''
        type: string
      tag_name:
        description: 'Release Tag 名称（留空则自动生成）'
        required: false
        default: ''
        type: string
      create_release:
        description: '是否创建 GitHub Release 并上传产物'
        required: true
        default: true
        type: boolean
      platforms:
        description: '编译平台（逗号分隔：macos,linux,windows,android）'
        required: true
        default: 'macos,linux,windows,android'
        type: string
      archs:
        description: '编译架构（逗号分隔：x64,arm64）'
        required: true
        default: 'x64,arm64'
        type: string
      backends:
        description: '启用的后端（逗号分隔：cpu,vulkan,cuda,metal,rocm,sycl,openvino,android）'
        required: true
        default: 'cpu,vulkan,cuda,metal,android'
        type: string
      cmake_args:
        description: '额外 CMake 参数（如 -DGGML_CUDA=ON -DLLAMA_BUILD_SERVER=ON）'
        required: false
        default: '-DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_TOOLS=ON -DLLAMA_BUILD_SERVER=ON -DGGML_RPC=ON -DLLAMA_OPENSSL=OFF'
        type: string

env:
  # 优先使用 PAT_TOKEN（跨仓库/私有仓库），回退到 GITHUB_TOKEN（同仓库/公开仓库）
  GH_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
  # 跨仓库引用 llama.cpp 官方 actions，零本地维护
  LLAMA_CPP_ACTIONS_REF: master

# 串行执行以更好地复用缓存
concurrency:
  group: prebuilt-release-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  # ═══════════════════════════════════════════
  # 1. 解析参数 & 生成版本号
  # ═══════════════════════════════════════════
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      tag_name: ${{ steps.version.outputs.tag_name }}
      repo_url: ${{ steps.resolve.outputs.repo_url }}
      repo_full: ${{ steps.resolve.outputs.repo_full }}
      repo_name: ${{ steps.resolve.outputs.repo_name }}
      ref: ${{ steps.resolve.outputs.ref }}
      pr_number: ${{ steps.resolve.outputs.pr_number }}
      pr_display: ${{ steps.resolve.outputs.pr_display }}
      is_pr: ${{ steps.resolve.outputs.is_pr }}
      create_release: ${{ steps.resolve.outputs.create_release }}
      platforms: ${{ steps.parse.outputs.platforms }}
      arch_x64: ${{ steps.parse.outputs.arch_x64 }}
      arch_arm64: ${{ steps.parse.outputs.arch_arm64 }}
      macos_matrix: ${{ steps.macos_matrix.outputs.macos_matrix }}
      linux_cpu_matrix: ${{ steps.linux_cpu_matrix.outputs.linux_cpu_matrix }}
      linux_vulkan_matrix: ${{ steps.linux_vulkan_matrix.outputs.linux_vulkan_matrix }}
      windows_cpu_matrix: ${{ steps.matrix.outputs.windows_cpu_matrix }}
      windows_cuda_matrix: ${{ steps.matrix.outputs.windows_cuda_matrix }}
      backends_cpu: ${{ steps.parse.outputs.backends_cpu }}
      backends_vulkan: ${{ steps.parse.outputs.backends_vulkan }}
      backends_cuda: ${{ steps.parse.outputs.backends_cuda }}
      backends_metal: ${{ steps.parse.outputs.backends_metal }}
      backends_rocm: ${{ steps.parse.outputs.backends_rocm }}
      backends_sycl: ${{ steps.parse.outputs.backends_sycl }}
      backends_openvino: ${{ steps.parse.outputs.backends_openvino }}
      backends_android: ${{ steps.parse.outputs.backends_android }}
    steps:
      - name: Resolve source (manual vs PR)
        id: resolve
        run: |
          set -e
          pr_input="${{ github.event.inputs.pr_number }}"
          is_pr="false"
          create_release="${{ github.event.inputs.create_release }}"

          if [ -n "$pr_input" ]; then
            repo_full="${{ github.event.inputs.repo_url }}"
            repo_full="${repo_full#https://github.com/}"
            repo_full="${repo_full%.git}"
            echo "Fetching PR #${pr_input} from ${repo_full} ..."

            pr_data=$(curl -sL -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${repo_full}/pulls/${pr_input}")

            if echo "$pr_data" | jq -e '.message' >/dev/null 2>&1; then
              echo "ERROR: GitHub API returned: $(echo "$pr_data" | jq -r '.message')"
              exit 1
            fi

            repo_url=$(echo "$pr_data" | jq -r '.head.repo.clone_url')
            ref=$(echo "$pr_data" | jq -r '.head.ref')
            pr_number="${pr_input}"
            is_pr="true"
            echo "Resolved PR #${pr_number}: ${repo_url} @ ${ref}"
          else
            repo_url="${{ github.event.inputs.repo_url }}"
            ref="${{ github.event.inputs.ref }}"
            pr_number=""
            echo "Mode: manual dispatch"
          fi

          repo_full="${repo_url#https://github.com/}"
          repo_full="${repo_full%.git}"
          repo_name=$(basename "$repo_full")

          echo "repo_url=${repo_url}" >> "$GITHUB_OUTPUT"
          echo "repo_full=${repo_full}" >> "$GITHUB_OUTPUT"
          echo "repo_name=${repo_name}" >> "$GITHUB_OUTPUT"
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"
          echo "pr_number=${pr_number}" >> "$GITHUB_OUTPUT"
          echo "pr_display=${pr_number:-无}" >> "$GITHUB_OUTPUT"
          echo "is_pr=${is_pr}" >> "$GITHUB_OUTPUT"
          echo "create_release=${create_release}" >> "$GITHUB_OUTPUT"
          echo "Resolved: ${repo_full} @ ${ref} (PR=${is_pr})"

      - name: Parse platforms, archs & backends
        id: parse
        run: |
          platforms="${{ github.event.inputs.platforms }}"
          echo "platforms=${platforms}" >> "$GITHUB_OUTPUT"

          archs="${{ github.event.inputs.archs }}"
          if echo "$archs" | grep -qi "x64"; then
            echo "arch_x64=true" >> "$GITHUB_OUTPUT"
          else
            echo "arch_x64=false" >> "$GITHUB_OUTPUT"
          fi
          if echo "$archs" | grep -qi "arm64"; then
            echo "arch_arm64=true" >> "$GITHUB_OUTPUT"
          else
            echo "arch_arm64=false" >> "$GITHUB_OUTPUT"
          fi

          backends="${{ github.event.inputs.backends }}"
          for b in cpu vulkan cuda metal rocm sycl openvino android; do
            if echo "$backends" | grep -qi "$b"; then
              echo "backends_${b}=true" >> "$GITHUB_OUTPUT"
            else
              echo "backends_${b}=false" >> "$GITHUB_OUTPUT"
            fi
          done
          echo "Active platforms: $platforms"
          echo "Active archs: $archs"
          echo "Active backends: $backends"

      - name: Generate macOS matrix
        id: macos_matrix
        run: |
          matrix='{"include":[]}'
          if [ "${{ steps.parse.outputs.arch_arm64 }}" = "true" ]; then
            matrix=$(echo "$matrix" | jq '.include += [{"build":"arm64","arch":"arm64","os":"macos-latest","defines":"-DGGML_METAL=ON -DCMAKE_OSX_DEPLOYMENT_TARGET=13.3"}]')
          fi
          if [ "${{ steps.parse.outputs.arch_x64 }}" = "true" ]; then
            matrix=$(echo "$matrix" | jq '.include += [{"build":"x64","arch":"x64","os":"macos-13","defines":"-DGGML_METAL=OFF -DCMAKE_OSX_DEPLOYMENT_TARGET=13.3"}]')
          fi
          echo "macos_matrix=$(echo "$matrix" | jq -c .)" >> "$GITHUB_OUTPUT"
          echo "macOS matrix: $(echo "$matrix" | jq -c .)"

      - name: Generate Linux CPU matrix
        id: linux_cpu_matrix
        run: |
          matrix='{"include":[]}'
          if [ "${{ steps.parse.outputs.arch_x64 }}" = "true" ]; then
            matrix=$(echo "$matrix" | jq '.include += [{"build":"x64","os":"ubuntu-22.04"}]')
          fi
          if [ "${{ steps.parse.outputs.arch_arm64 }}" = "true" ]; then
            matrix=$(echo "$matrix" | jq '.include += [{"build":"arm64","os":"ubuntu-24.04-arm"}]')
          fi
          echo "linux_cpu_matrix=$(echo "$matrix" | jq -c .)" >> "$GITHUB_OUTPUT"
          echo "Linux CPU matrix: $(echo "$matrix" | jq -c .)"

      - name: Generate Linux Vulkan matrix
        id: linux_vulkan_matrix
        run: |
          matrix='{"include":[]}'
          if [ "${{ steps.parse.outputs.arch_x64 }}" = "true" ]; then
            matrix=$(echo "$matrix" | jq '.include += [{"build":"x64","os":"ubuntu-22.04"}]')
          fi
          if [ "${{ steps.parse.outputs.arch_arm64 }}" = "true" ]; then
            matrix=$(echo "$matrix" | jq '.include += [{"build":"arm64","os":"ubuntu-24.04-arm"}]')
          fi
          echo "linux_vulkan_matrix=$(echo "$matrix" | jq -c .)" >> "$GITHUB_OUTPUT"
          echo "Linux Vulkan matrix: $(echo "$matrix" | jq -c .)"

      - name: Generate Windows matrices
        id: matrix
        run: |
          archs="${{ github.event.inputs.archs }}"

          cpu_matrix='{"include":[]}'
          if echo "$archs" | grep -qi "x64"; then
            cpu_matrix=$(echo "$cpu_matrix" | jq '.include += [{"arch":"x64"}]')
          fi
          if echo "$archs" | grep -qi "arm64"; then
            cpu_matrix=$(echo "$cpu_matrix" | jq '.include += [{"arch":"arm64"}]')
          fi
          echo "windows_cpu_matrix=$(echo "$cpu_matrix" | jq -c .)" >> "$GITHUB_OUTPUT"

          cuda_matrix='{"include":[]}'
          if echo "$archs" | grep -qi "x64"; then
            cuda_matrix=$(echo "$cuda_matrix" | jq '.include += [{"cuda":"12.4","arch":"x64"},{"cuda":"13.3","arch":"x64"}]')
          fi
          echo "windows_cuda_matrix=$(echo "$cuda_matrix" | jq -c .)" >> "$GITHUB_OUTPUT"

          echo "CPU matrix: $(echo "$cpu_matrix" | jq -c .)"
          echo "CUDA matrix: $(echo "$cuda_matrix" | jq -c .)"

      - name: Checkout target repo (for version detection)
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.resolve.outputs.repo_full }}
          ref: ${{ steps.resolve.outputs.ref }}
          fetch-depth: 0

      - name: Generate version tag
        id: version
        run: |
          set -e
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            tag="${{ github.event.inputs.tag_name }}"
          elif [ -f "cmake/build-info.cmake" ] && grep -q "BUILD_NUMBER" cmake/build-info.cmake; then
            build_number=$(grep "set(BUILD_NUMBER" cmake/build-info.cmake | grep -oP '\d+' | head -1)
            if [ -n "$build_number" ] && [ "$build_number" -gt 0 ]; then
              tag="b${build_number}"
            fi
          fi
          if [ -z "$tag" ]; then
            short_sha=$(git rev-parse --short HEAD)
            tag="${short_sha}"
          fi

          # 追加 8 位时间戳编码（36 进制：0-9a-z）
          epoch=$(date +%s)
          encode36() {
            local n=$1
            local chars="0123456789abcdefghijklmnopqrstuvwxyz"
            local out=""
            while [ "$n" -gt 0 ]; do
              local rem=$(( n % 36 ))
              out="${chars:$rem:1}${out}"
              n=$(( n / 36 ))
            done
            printf "%s" "$out"
          }
          ts36=$(encode36 "$epoch")
          # 补齐到 8 位
          while [ "${#ts36}" -lt 8 ]; do
            ts36="0${ts36}"
          done
          tag="${tag}-${ts36}"

          if [ "${{ steps.resolve.outputs.is_pr }}" = "true" ] && [ -n "${{ steps.resolve.outputs.pr_number }}" ]; then
            tag="pr-${{ steps.resolve.outputs.pr_number }}-${tag}"
          fi
          echo "tag_name=${tag}" >> "$GITHUB_OUTPUT"
          echo "Resolved tag: ${tag}"

  # ═══════════════════════════════════════════
  # 2. macOS 编译（CPU + Metal）
  # ═══════════════════════════════════════════
  macos:
    needs: prepare
    if: ${{ contains(needs.prepare.outputs.platforms, 'macos') && (needs.prepare.outputs.backends_cpu == 'true' || needs.prepare.outputs.backends_metal == 'true') && needs.prepare.outputs.macos_matrix != '{"include":[]}' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.macos_matrix) }}
    runs-on: ${{ matrix.os }}
    env:
      CMAKE_ARGS: ${{ github.event.inputs.cmake_args }}
    steps:
      - name: Clone target repo
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.prepare.outputs.repo_full }}
          ref: ${{ needs.prepare.outputs.ref }}
          fetch-depth: 0

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: prebuilt-macos-${{ matrix.build }}-${{ needs.prepare.outputs.ref }}
          max-size: 2G

      - name: Build
        run: |
          cmake -B build \
            ${{ matrix.defines }} \
            -DCMAKE_INSTALL_RPATH='@loader_path' \
            -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON \
            -DGGML_NATIVE=OFF \
            -DLLAMA_FATAL_WARNINGS=ON \
            ${{ env.CMAKE_ARGS }}
          cmake --build build --config Release -j $(sysctl -n hw.logicalcpu)

      - name: Pack artifacts
        run: |
          cp LICENSE ./build/bin/ 2>/dev/null || true
          tar -czvf ${{ needs.prepare.outputs.repo_name }}-${{ needs.prepare.outputs.tag_name }}-bin-macos-${{ matrix.build }}.tar.gz \
            -s ",^\\.,${{ needs.prepare.outputs.repo_name }}-${{ needs.prepare.outputs.tag_name }}," \
            -C ./build/bin .

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.prepare.outputs.repo_name }}-bin-macos-${{ matrix.build }}.tar.gz
          path: ${{ needs.prepare.outputs.repo_name }}-${{ needs.prepare.outputs.tag_name }}-bin-macos-${{ matrix.build }}.tar.gz

  # ═══════════════════════════════════════════
  # 3. Linux CPU 编译（x64 / arm64）
  # ═══════════════════════════════════════════
  linux-cpu:
    needs: prepare
    if: ${{ contains(needs.prepare.outputs.platforms, 'linux') && needs.prepare.outputs.backends_cpu == 'true' && needs.prepare.outputs.linux_cpu_matrix != '{"include":[]}' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.linux_cpu_matrix) }}
    runs-on: ${{ matrix.os }}
    env:
      CMAKE_ARGS: ${{ github.event.inputs.cmake_args }}
    steps:
      - name: Clone target repo
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.prepare.outputs.repo_full }}
          ref: ${{ needs.prepare.outputs.ref }}
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev

      - name: Toolchain workaround (GCC 14)
        if: ${{ contains(matrix.os, 'ubuntu-24.04') }}
        run: |
          sudo apt-get install -y gcc-14 g++-14
          echo "CC=gcc-14" >> "$GITHUB_ENV"
          echo "CXX=g++-14" >> "$GITHUB_ENV"

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: prebuilt-linux-cpu-${{ matrix.build }}-${{ needs.prepare.outputs.ref }}
          max-size: 2G

      - name: Build
        run: |
          cmake -B build \
            -DCMAKE_INSTALL_RPATH='$ORIGIN' \
            -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON \
            -DGGML_BACKEND_DL=ON \
            -DGGML_NATIVE=OFF \
            -DGGML_CPU_ALL_VARIANTS=ON \
            -DLLAMA_FATAL_WARNINGS=ON \
            ${{ env.CMAKE_ARGS }}
          cmake --build build --config Release -j $(nproc)

      - name: Pack artifacts
        run: |
          cp LICENSE ./build/bin/ 2>/dev/null || true
          tar -czvf ${{ needs.prepare.outputs.repo_name }}-${{ needs.prepare.outputs.tag_name }}-bin-linux-${{ matrix.build }}.tar.gz \
            --transform "s,^\\.,${{ needs.prepare.outputs.repo_name }}-${{ needs.prepare.outputs.tag_name }}," \
            -C ./build/bin .

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.prepare.outputs.repo_name }}-bin-linux-${{ matrix.build }}.tar.gz
          path: ${{ needs.prepare.outputs.repo_name }}-${{ needs.prepare.outputs.tag_name }}-bin-linux-${{ matrix.build }}.tar.gz

  # ═══════════════════════════════════════════
  # 4. Linux Vulkan 编译
  # ═══════════════════════════════════════════
  linux-vulkan:
    needs: prepare
    if: ${{ contains(needs.prepare.outputs.platforms, 'linux') && needs.prepare.outputs.backends_vulkan == 'true' && needs.prepare.outputs.linux_vulkan_matrix != '{"include":[]}' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.linux_vulkan_matrix) }}
    runs-on: ${{ matrix.os }}
    env:
      CMAKE_ARGS: ${{ github.event.inputs.cmake_args }}
    steps:
      - name: Clone target repo
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.prepare.outputs.repo_full }}
          ref: ${{ needs.prepare.outputs.ref }}
          fetch-depth: 0

      - name: Install Vulkan SDK
        run: |
          if [[ "${{ matrix.os }}" =~ "ubuntu-22.04" ]]; then
            wget -qO - https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo apt-key add -
            sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-jammy.list https://packages.lunarg.com/vulkan/lunarg-vulkan-jammy.list
            sudo apt-get update -y
            sudo apt-get install -y build-essential mesa-vulkan-drivers vulkan-sdk libssl-dev
          else
            sudo apt-get update -y
            sudo apt-get install -y gcc-14 g++-14 build-essential glslc libvulkan-dev spirv-headers libssl-dev ninja-build
            echo "CC=gcc-14" >> "$GITHUB_ENV"
            echo "CXX=g++-14" >> "$GITHUB_ENV"
          fi

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: prebuilt-linux-vulkan-${{ matrix.build }}-${{ needs.prepare.outputs.ref }}
          max-size: 2G

      - name: Build
        run: |
          cmake -B build \
            -DCMAKE_INSTALL_RPATH='$ORIGIN' \
            -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON \
            -DGGML_BACKEND_DL=ON \
            -DGGML_NATIVE=OFF \
            -DGGML_CPU_ALL_VARIANTS=ON \
            -DGGML_VULKAN=ON \
            ${{ env.CMAKE_ARGS }}
          cmake --build build --config Release -j $(nproc)

      - name: Pack artifacts
        run: |
          cp LICENSE ./build/bin/ 2>/dev/null || true
          tar -czvf ${{ needs.prepare.outputs.repo_name }}-${{ needs.prepare.outputs.tag_name }}-bin-linux-vulkan-${{ matrix.build }}.tar.gz \
            --transform "s,^\\.,${{ needs.prepare.outputs.repo_name }}-${{ needs.prepare.outputs.tag_name }}," \
            -C ./build/bin .

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.prepare.outputs.repo_name }}-bin-linux-vulkan-${{ matrix.build }}.tar.gz
          path: ${{ needs.prepare.outputs.repo_name }}-${{ needs.prepare.outputs.tag_name }}-bin-linux-vulkan-${{ matrix.build }}.tar.gz

  # ═══════════════════════════════════════════
  # 5. Android 编译（arm64）
  # ═══════════════════════════════════════════
  android:
    needs: prepare
    if: ${{ contains(needs.prepare.outputs.platforms, 'android') && needs.prepare.outputs.backends_android == 'true' && needs.prepare.outputs.arch_arm64 == 'true' }}
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: "29.0.14206865"
      CMAKE_ARGS: ${{ github.event.inputs.cmake_args }}
    steps:
      - name: Clone target repo
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.prepare.outputs.repo_full }}
          ref: ${{ needs.prepare.outputs.ref }}
          fetch-depth: 0

      - name: Setup JDK & Android SDK
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - uses: android-actions/setup-android@v3
        with:
          log-accepted-android-sdk-licenses: false

      - name: Install NDK
        run: |
          sdkmanager "ndk;${{ env.NDK_VERSION }}"
          echo "ANDROID_NDK=${ANDROID_SDK_ROOT}/ndk/${{ env.NDK_VERSION }}" >> "$GITHUB_ENV"

      - name: Build
        run: |
          cmake -B build \
            -DCMAKE_TOOLCHAIN_FILE=${ANDROID_NDK}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DCMAKE_INSTALL_RPATH='$ORIGIN' \
            -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON \
            -DGGML_BACKEND_DL=ON \
            -DGGML_NATIVE=OFF \
            -DGGML_CPU_ALL_VARIANTS=ON \
            -DGGML_OPENMP=OFF \
            ${{ env.CMAKE_ARGS }}
          cmake --build build --config Release -j $(nproc)

      - name: Pack artifacts
        run: |
          cp LICENSE ./build/bin/ 2>/dev/null || true
          tar -czvf ${{ needs.prepare.outputs.repo_name }}-${{ needs.prepare.outputs.tag_name }}-bin-android-arm64.tar.gz \
            --transform "s,^\\.,${{ needs.prepare.outputs.repo_name }}-${{ needs.prepare.outputs.tag_name }}," \
            -C ./build/bin .

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.prepare.outputs.repo_name }}-bin-android-arm64.tar.gz
          path: ${{ needs.prepare.outputs.repo_name }}-${{ needs.prepare.outputs.tag_name }}-bin-android-arm64.tar.gz

  # ═══════════════════════════════════════════
  # 6. Windows CPU 编译
  # ═══════════════════════════════════════════
  windows-cpu:
    needs: prepare
    if: ${{ contains(needs.prepare.outputs.platforms, 'windows') && needs.prepare.outputs.backends_cpu == 'true' && needs.prepare.outputs.windows_cpu_matrix != '{"include":[]}' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.windows_cpu_matrix) }}
    runs-on: windows-latest
    env:
      CMAKE_ARGS: ${{ github.event.inputs.cmake_args }}
    steps:
      - name: Clone target repo
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.prepare.outputs.repo_full }}
          ref: ${{ needs.prepare.outputs.ref }}
          fetch-depth: 0

      - name: Install Ninja
        run: choco install ninja

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: prebuilt-windows-cpu-${{ matrix.arch }}-${{ needs.prepare.outputs.ref }}
          max-size: 2G

      - name: Build
        shell: cmd
        run: |
          cmake -S . -B build -G "Ninja Multi-Config" ^
            -D CMAKE_TOOLCHAIN_FILE=cmake/${{ matrix.arch }}-windows-llvm.cmake ^
            -DGGML_NATIVE=OFF ^
            -DGGML_BACKEND_DL=ON ^
            -DBUILD_SHARED_LIBS=ON ^
            -DGGML_CPU_ALL_VARIANTS=${{ matrix.arch == 'x64' && 'ON' || 'OFF' }} ^
            -DGGML_OPENMP=ON ^
            ${{ env.CMAKE_ARGS }}
          cmake --build build --config Release

      - name: Pack artifacts
        run: |
          mkdir .\dist
          copy .\build\bin\Release\*.exe .\dist\
          copy .\build\bin\Release\*.dll .\dist\
          7z a -snl ${{ needs.prepare.outputs.repo_name }}-${{ needs.prepare.outputs.tag_name }}-bin-win-cpu-${{ matrix.arch }}.zip .\dist\*

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.prepare.outputs.repo_name }}-bin-win-cpu-${{ matrix.arch }}.zip
          path: ${{ needs.prepare.outputs.repo_name }}-${{ needs.prepare.outputs.tag_name }}-bin-win-cpu-${{ matrix.arch }}.zip

  # ═══════════════════════════════════════════
  # 7. Windows CUDA 编译
  # ═══════════════════════════════════════════
  windows-cuda:
    needs: prepare
    if: ${{ contains(needs.prepare.outputs.platforms, 'windows') && needs.prepare.outputs.backends_cuda == 'true' && needs.prepare.outputs.windows_cuda_matrix != '{"include":[]}' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.windows_cuda_matrix) }}
    runs-on: windows-2022
    permissions:
      actions: write
    env:
      CMAKE_ARGS: ${{ github.event.inputs.cmake_args }}
    steps:
      - name: Clone target repo
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.prepare.outputs.repo_full }}
          ref: ${{ needs.prepare.outputs.ref }}
          fetch-depth: 0

      - name: Install CUDA Toolkit
        uses: ggml-org/llama.cpp/.github/actions/windows-setup-cuda@${{ env.LLAMA_CPP_ACTIONS_REF }}
        with:
          cuda_version: ${{ matrix.cuda }}

      - name: Install Ninja
        run: choco install ninja

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: prebuilt-windows-cuda${{ matrix.cuda }}-${{ needs.prepare.outputs.ref }}
          max-size: 2G

      - name: Build
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          cmake -S . -B build -G "Ninja Multi-Config" ^
            -DGGML_BACKEND_DL=ON ^
            -DBUILD_SHARED_LIBS=ON ^
            -DGGML_NATIVE=OFF ^
            -DGGML_CPU_ALL_VARIANTS=ON ^
            -DGGML_CUDA=ON ^
            ${{ env.CMAKE_ARGS }}
          cmake --build build --config Release -j %NUMBER_OF_PROCESSORS%

      - name: Pack artifacts
        run: |
          mkdir .\dist
          copy .\build\bin\Release\*.exe .\dist\
          copy .\build\bin\Release\*.dll .\dist\
          7z a -snl ${{ needs.prepare.outputs.repo_name }}-${{ needs.prepare.outputs.tag_name }}-bin-win-cuda-${{ matrix.cuda }}-${{ matrix.arch }}.zip .\dist\*

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.prepare.outputs.repo_name }}-bin-win-cuda-${{ matrix.cuda }}-${{ matrix.arch }}.zip
          path: ${{ needs.prepare.outputs.repo_name }}-${{ needs.prepare.outputs.tag_name }}-bin-win-cuda-${{ matrix.cuda }}-${{ matrix.arch }}.zip

      - name: ccache-clear
        if: always()
        uses: ggml-org/llama.cpp/.github/actions/ccache-clear@${{ env.LLAMA_CPP_ACTIONS_REF }}
        with:
          key: prebuilt-windows-cuda${{ matrix.cuda }}-${{ needs.prepare.outputs.ref }}

  # ═══════════════════════════════════════════
  # 8. Windows Vulkan 编译
  # ═══════════════════════════════════════════
  windows-vulkan:
    needs: prepare
    if: ${{ contains(needs.prepare.outputs.platforms, 'windows') && needs.prepare.outputs.backends_vulkan == 'true' && needs.prepare.outputs.arch_x64 == 'true' }}
    runs-on: windows-latest
    env:
      VULKAN_VERSION: "1.4.357.0"
      CMAKE_ARGS: ${{ github.event.inputs.cmake_args }}
    steps:
      - name: Clone target repo
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.prepare.outputs.repo_full }}
          ref: ${{ needs.prepare.outputs.ref }}
          fetch-depth: 0

      - name: Install Vulkan SDK
        run: |
          curl.exe -o $env:RUNNER_TEMP/VulkanSDK-Installer.exe -L "https://sdk.lunarg.com/sdk/download/${env:VULKAN_VERSION}/windows/vulkansdk-windows-X64-${env:VULKAN_VERSION}.exe"
          & "$env:RUNNER_TEMP\VulkanSDK-Installer.exe" --accept-licenses --default-answer --confirm-command install
          Add-Content $env:GITHUB_ENV "VULKAN_SDK=C:\VulkanSDK\${env:VULKAN_VERSION}"
          Add-Content $env:GITHUB_PATH "C:\VulkanSDK\${env:VULKAN_VERSION}\bin"

      - name: Install Ninja
        run: choco install ninja

      - name: Build
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          cmake -S . -B build -G "Ninja Multi-Config" ^
            -DGGML_VULKAN=ON -DGGML_NATIVE=OFF -DGGML_CPU_ALL_VARIANTS=ON -DGGML_BACKEND_DL=ON ^
            -DBUILD_SHARED_LIBS=ON ^
            ${{ env.CMAKE_ARGS }}
          cmake --build build --config Release

      - name: Pack artifacts
        run: |
          mkdir .\dist
          copy .\build\bin\Release\*.exe .\dist\
          copy .\build\bin\Release\*.dll .\dist\
          7z a -snl ${{ needs.prepare.outputs.repo_name }}-${{ needs.prepare.outputs.tag_name }}-bin-win-vulkan-x64.zip .\dist\*

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.prepare.outputs.repo_name }}-bin-win-vulkan-x64.zip
          path: ${{ needs.prepare.outputs.repo_name }}-${{ needs.prepare.outputs.tag_name }}-bin-win-vulkan-x64.zip

  # ═══════════════════════════════════════════
  # 9. Linux ROCm 编译（x64）
  # ═══════════════════════════════════════════
  linux-rocm:
    needs: prepare
    if: ${{ contains(needs.prepare.outputs.platforms, 'linux') && needs.prepare.outputs.backends_rocm == 'true' && needs.prepare.outputs.arch_x64 == 'true' }}
    runs-on: ubuntu-22.04
    permissions:
      actions: write
    env:
      CMAKE_ARGS: ${{ github.event.inputs.cmake_args }}
    steps:
      - name: Clone target repo
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.prepare.outputs.repo_full }}
          ref: ${{ needs.prepare.outputs.ref }}
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev git cmake wget

      - name: Setup ROCm
        run: |
          sudo mkdir -p /etc/apt/keyrings
          wget -qO - https://repo.radeon.com/rocm/rocm.gpg.key | sudo gpg --dearmor -o /etc/apt/keyrings/rocm.gpg
          echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/rocm.gpg] https://repo.radeon.com/rocm/apt/7.2.1 jammy main" | sudo tee /etc/apt/sources.list.d/rocm.list
          sudo apt-get update
          sudo apt-get install -y rocm-hip-sdk

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: prebuilt-linux-rocm-x64-${{ needs.prepare.outputs.ref }}
          max-size: 2G

      - name: Build
        run: |
          cmake -B build \
            -DCMAKE_INSTALL_RPATH='$ORIGIN' \
            -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON \
            -DGGML_BACKEND_DL=ON \
            -DGGML_NATIVE=OFF \
            -DGGML_CPU_ALL_VARIANTS=ON \
            -DGPU_TARGETS="gfx908;gfx90a;gfx942;gfx1030;gfx1100;gfx1101;gfx1102;gfx1151;gfx1150;gfx1200;gfx1201" \
            -DGGML_HIP=ON \
            -DHIP_PLATFORM=amd \
            -DGGML_HIP_ROCWMMA_FATTN=ON \
            ${{ env.CMAKE_ARGS }}
          cmake --build build --config Release -j $(nproc)

      - name: ccache-clear
        if: always()
        uses: ggml-org/llama.cpp/.github/actions/ccache-clear@${{ env.LLAMA_CPP_ACTIONS_REF }}
        with:
          key: prebuilt-linux-rocm-x64-${{ needs.prepare.outputs.ref }}

      - name: Pack artifacts
        run: |
          cp LICENSE ./build/bin/ 2>/dev/null || true
          tar -czvf ${{ needs.prepare.outputs.repo_name }}-${{ needs.prepare.outputs.tag_name }}-bin-linux-rocm-x64.tar.gz \
            --transform "s,^\\.,${{ needs.prepare.outputs.repo_name }}-${{ needs.prepare.outputs.tag_name }}," \
            -C ./build/bin .

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.prepare.outputs.repo_name }}-bin-linux-rocm-x64.tar.gz
          path: ${{ needs.prepare.outputs.repo_name }}-${{ needs.prepare.outputs.tag_name }}-bin-linux-rocm-x64.tar.gz

  # ═══════════════════════════════════════════
  # 10. Linux SYCL 编译（x64）
  # ═══════════════════════════════════════════
  linux-sycl:
    needs: prepare
    if: ${{ contains(needs.prepare.outputs.platforms, 'linux') && needs.prepare.outputs.backends_sycl == 'true' && needs.prepare.outputs.arch_x64 == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    env:
      CMAKE_ARGS: ${{ github.event.inputs.cmake_args }}
      ONEAPI_INSTALLER_VERSION: "2025.3.3"
      LEVEL_ZERO_VERSION: "1.28.2"
      LEVEL_ZERO_UBUNTU_VERSION: "u24.04"
    steps:
      - name: Clone target repo
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.prepare.outputs.repo_full }}
          ref: ${{ needs.prepare.outputs.ref }}
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev

      - name: Download & Install oneAPI
        shell: bash
        run: |
          cd /tmp
          wget https://registrationcenter-download.intel.com/akdlm/IRC_NAS/56f7923a-adb8-43f3-8b02-2b60fcac8cab/intel-deep-learning-essentials-2025.3.3.16_offline.sh -O intel-deep-learning-essentials_offline.sh
          sudo bash intel-deep-learning-essentials_offline.sh -s -a --silent --eula accept

      - name: Install Level Zero SDK
        shell: bash
        run: |
          cd /tmp
          wget -q "https://github.com/oneapi-src/level-zero/releases/download/v${LEVEL_ZERO_VERSION}/level-zero_${LEVEL_ZERO_VERSION}%2B${LEVEL_ZERO_UBUNTU_VERSION}_amd64.deb" -O level-zero.deb
          wget -q "https://github.com/oneapi-src/level-zero/releases/download/v${LEVEL_ZERO_VERSION}/level-zero-devel_${LEVEL_ZERO_VERSION}%2B${LEVEL_ZERO_UBUNTU_VERSION}_amd64.deb" -O level-zero-devel.deb
          sudo apt-get install -y ./level-zero.deb ./level-zero-devel.deb

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: prebuilt-linux-sycl-x64-${{ needs.prepare.outputs.ref }}
          max-size: 2G

      - name: Build
        run: |
          source /opt/intel/oneapi/setvars.sh
          cmake -B build \
            -G "Ninja" \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_SYCL=ON \
            -DCMAKE_C_COMPILER=icx \
            -DCMAKE_CXX_COMPILER=icpx \
            -DLLAMA_OPENSSL=OFF \
            -DGGML_NATIVE=OFF \
            -DGGML_CPU_ALL_VARIANTS=ON \
            ${{ env.CMAKE_ARGS }}
          cmake --build build --config Release -j $(nproc)

      - name: ccache-clear
        if: always()
        uses: ggml-org/llama.cpp/.github/actions/ccache-clear@${{ env.LLAMA_CPP_ACTIONS_REF }}
        with:
          key: prebuilt-linux-sycl-x64-${{ needs.prepare.outputs.ref }}

      - name: Pack artifacts
        run: |
          cp LICENSE ./build/bin/ 2>/dev/null || true
          tar -czvf ${{ needs.prepare.outputs.repo_name }}-${{ needs.prepare.outputs.tag_name }}-bin-linux-sycl-x64.tar.gz \
            --transform "s,^\\.,${{ needs.prepare.outputs.repo_name }}-${{ needs.prepare.outputs.tag_name }}," \
            -C ./build/bin .

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.prepare.outputs.repo_name }}-bin-linux-sycl-x64.tar.gz
          path: ${{ needs.prepare.outputs.repo_name }}-${{ needs.prepare.outputs.tag_name }}-bin-linux-sycl-x64.tar.gz

  # ═══════════════════════════════════════════
  # 11. Linux OpenVINO 编译（x64）
  # ═══════════════════════════════════════════
  linux-openvino:
    needs: prepare
    if: ${{ contains(needs.prepare.outputs.platforms, 'linux') && needs.prepare.outputs.backends_openvino == 'true' && needs.prepare.outputs.arch_x64 == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    env:
      CMAKE_ARGS: ${{ github.event.inputs.cmake_args }}
      OPENVINO_VERSION_MAJOR: "2026.2.1"
      OPENVINO_VERSION_FULL: "2026.2.1.21919.ede283a88e3"
    steps:
      - name: Clone target repo
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.prepare.outputs.repo_full }}
          ref: ${{ needs.prepare.outputs.ref }}
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev libtbb12 cmake ninja-build python3-pip
          sudo apt-get install -y ocl-icd-opencl-dev opencl-headers opencl-clhpp-headers intel-opencl-icd

      - name: Use OpenVINO Toolkit Cache
        uses: actions/cache@v5
        id: cache-openvino
        with:
          path: ./openvino_toolkit
          key: cache-gha-openvino-toolkit-v${{ env.OPENVINO_VERSION_FULL }}-${{ runner.os }}

      - name: Setup OpenVINO Toolkit
        if: steps.cache-openvino.outputs.cache-hit != 'true'
        uses: ggml-org/llama.cpp/.github/actions/linux-setup-openvino@${{ env.LLAMA_CPP_ACTIONS_REF }}
        with:
          path: ./openvino_toolkit
          version_major: ${{ env.OPENVINO_VERSION_MAJOR }}
          version_full: ${{ env.OPENVINO_VERSION_FULL }}

      - name: Install OpenVINO dependencies
        run: |
          cd ./openvino_toolkit
          chmod +x ./install_dependencies/install_openvino_dependencies.sh
          echo "Y" | sudo -E ./install_dependencies/install_openvino_dependencies.sh

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: prebuilt-linux-openvino-x64-${{ needs.prepare.outputs.ref }}
          max-size: 2G

      - name: Build
        run: |
          source ./openvino_toolkit/setupvars.sh
          cmake -B build/ReleaseOV -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_OPENVINO=ON \
            -DCMAKE_INSTALL_RPATH='$ORIGIN' \
            -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON \
            -DGGML_CPU_ALL_VARIANTS=ON \
            ${{ env.CMAKE_ARGS }}
          cmake --build build/ReleaseOV --config Release --parallel

      - name: ccache-clear
        if: always()
        uses: ggml-org/llama.cpp/.github/actions/ccache-clear@${{ env.LLAMA_CPP_ACTIONS_REF }}
        with:
          key: prebuilt-linux-openvino-x64-${{ needs.prepare.outputs.ref }}

      - name: Pack artifacts
        run: |
          dest=./build/ReleaseOV/bin
          OPENVINO_ROOT=./openvino_toolkit
          ov_lib="$OPENVINO_ROOT/runtime/lib/intel64"

          cp -P "$ov_lib"/libopenvino.so* \
                "$ov_lib"/libopenvino_c.so* \
                "$ov_lib"/libopenvino_*_plugin.so \
                "$ov_lib"/libopenvino_intel_npu_compiler*.so \
                "$OPENVINO_ROOT"/runtime/3rdparty/tbb/lib/*.so* \
                "$dest"
          cp -P /usr/lib/x86_64-linux-gnu/libOpenCL.so.1* "$dest" 2>/dev/null || true
          cp "$ov_lib"/cache.json "$dest" 2>/dev/null || true
          cp -r "$OPENVINO_ROOT"/docs/licensing "$dest"/openvino-licensing
          cp LICENSE "$dest"

          tar -czvf ${{ needs.prepare.outputs.repo_name }}-${{ needs.prepare.outputs.tag_name }}-bin-linux-openvino-${{ env.OPENVINO_VERSION_MAJOR }}-x64.tar.gz \
            --transform "s,^\\.,${{ needs.prepare.outputs.repo_name }}-${{ needs.prepare.outputs.tag_name }}," \
            -C "$dest" .

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.prepare.outputs.repo_name }}-bin-linux-openvino-${{ env.OPENVINO_VERSION_MAJOR }}-x64.tar.gz
          path: ${{ needs.prepare.outputs.repo_name }}-${{ needs.prepare.outputs.tag_name }}-bin-linux-openvino-${{ env.OPENVINO_VERSION_MAJOR }}-x64.tar.gz

  # ═══════════════════════════════════════════
  # 12. Windows HIP 编译（x64）
  # ═══════════════════════════════════════════
  windows-hip:
    needs: prepare
    if: ${{ contains(needs.prepare.outputs.platforms, 'windows') && needs.prepare.outputs.backends_rocm == 'true' && needs.prepare.outputs.arch_x64 == 'true' }}
    runs-on: windows-2022
    permissions:
      actions: write
    env:
      CMAKE_ARGS: ${{ github.event.inputs.cmake_args }}
      HIPSDK_INSTALLER_VERSION: "26.Q1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "radeon"
            gpu_targets: "gfx1150;gfx1151;gfx1200;gfx1201;gfx1100;gfx1101;gfx1102;gfx1030;gfx1031;gfx1032"
    steps:
      - name: Clone target repo
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.prepare.outputs.repo_full }}
          ref: ${{ needs.prepare.outputs.ref }}
          fetch-depth: 0

      - name: Grab rocWMMA package
        run: |
          curl -o rocwmma.deb "https://repo.radeon.com/rocm/apt/7.2.1/pool/main/r/rocwmma-dev/rocwmma-dev_2.2.0.70201-81~24.04_amd64.deb"
          7z x rocwmma.deb
          7z x data.tar

      - name: Cache ROCm Installation
        uses: actions/cache@v5
        id: cache-rocm
        with:
          path: C:\Program Files\AMD\ROCm
          key: cache-gha-rocm-${{ env.HIPSDK_INSTALLER_VERSION }}-${{ runner.os }}

      - name: Setup ROCm
        if: steps.cache-rocm.outputs.cache-hit != 'true'
        uses: ggml-org/llama.cpp/.github/actions/windows-setup-rocm@${{ env.LLAMA_CPP_ACTIONS_REF }}
        with:
          version: ${{ env.HIPSDK_INSTALLER_VERSION }}

      - name: Verify ROCm
        run: |
          $clangPath = Get-ChildItem 'C:\Program Files\AMD\ROCm\*\bin\clang.exe' | Select-Object -First 1
          if (-not $clangPath) { Write-Error "ROCm installation not found"; exit 1 }
          & $clangPath.FullName --version

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: prebuilt-windows-hip-${{ env.HIPSDK_INSTALLER_VERSION }}-${{ matrix.name }}-${{ needs.prepare.outputs.ref }}
          max-size: 2G

      - name: Build
        run: |
          $env:HIP_PATH=$(Resolve-Path 'C:\Program Files\AMD\ROCm\*\bin\clang.exe' | split-path | split-path)
          $env:CMAKE_PREFIX_PATH="${env:HIP_PATH}"
          cmake -G "Unix Makefiles" -B build -S . `
            -DCMAKE_C_COMPILER="${env:HIP_PATH}\bin\clang.exe" `
            -DCMAKE_CXX_COMPILER="${env:HIP_PATH}\bin\clang++.exe" `
            -DCMAKE_CXX_FLAGS="-I$($PWD.Path.Replace('\', '/'))/opt/rocm-7.2.1/include/ -Wno-ignored-attributes -Wno-nested-anon-types" `
            -DCMAKE_BUILD_TYPE=Release `
            -DGGML_BACKEND_DL=ON `
            -DGGML_NATIVE=OFF `
            -DGGML_CPU=OFF `
            -DGPU_TARGETS="${{ matrix.gpu_targets }}" `
            -DGGML_HIP_ROCWMMA_FATTN=ON `
            -DGGML_HIP=ON `
            ${{ env.CMAKE_ARGS }}
          cmake --build build --target ggml-hip -j ${env:NUMBER_OF_PROCESSORS}
          md "build\bin\rocblas\library\"
          md "build\bin\hipblaslt\library"
          cp "${env:HIP_PATH}\bin\libhipblas.dll" "build\bin\"
          cp "${env:HIP_PATH}\bin\libhipblaslt.dll" "build\bin\"
          cp "${env:HIP_PATH}\bin\rocblas.dll" "build\bin\"
          cp "${env:HIP_PATH}\bin\rocblas\library\*" "build\bin\rocblas\library\"
          cp "${env:HIP_PATH}\bin\hipblaslt\library\*" "build\bin\hipblaslt\library\"

      - name: ccache-clear
        if: always()
        uses: ggml-org/llama.cpp/.github/actions/ccache-clear@${{ env.LLAMA_CPP_ACTIONS_REF }}
        with:
          key: prebuilt-windows-hip-${{ env.HIPSDK_INSTALLER_VERSION }}-${{ matrix.name }}-${{ needs.prepare.outputs.ref }}

      - name: Pack artifacts
        run: |
          7z a -snl ${{ needs.prepare.outputs.repo_name }}-${{ needs.prepare.outputs.tag_name }}-bin-win-hip-${{ matrix.name }}-x64.zip .\build\bin\*

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.prepare.outputs.repo_name }}-bin-win-hip-${{ matrix.name }}-x64.zip
          path: ${{ needs.prepare.outputs.repo_name }}-${{ needs.prepare.outputs.tag_name }}-bin-win-hip-${{ matrix.name }}-x64.zip

  # ═══════════════════════════════════════════
  # 13. Windows SYCL 编译（x64）
  # ═══════════════════════════════════════════
  windows-sycl:
    needs: prepare
    if: ${{ contains(needs.prepare.outputs.platforms, 'windows') && needs.prepare.outputs.backends_sycl == 'true' && needs.prepare.outputs.arch_x64 == 'true' }}
    runs-on: windows-2022
    permissions:
      actions: write
    env:
      CMAKE_ARGS: ${{ github.event.inputs.cmake_args }}
      WINDOWS_BASEKIT_URL: https://registrationcenter-download.intel.com/akdlm/IRC_NAS/b60765d1-2b85-4e85-86b6-cb0e9563a699/intel-deep-learning-essentials-2025.3.3.18_offline.exe
      WINDOWS_DPCPP_MKL: intel.oneapi.win.cpp-dpcpp-common:intel.oneapi.win.mkl.devel:intel.oneapi.win.dnnl:intel.oneapi.win.tbb.devel
      LEVEL_ZERO_SDK_URL: https://github.com/oneapi-src/level-zero/releases/download/v1.28.2/level-zero-win-sdk-1.28.2.zip
      ONEAPI_ROOT: "C:/Program Files (x86)/Intel/oneAPI"
      ONEAPI_INSTALLER_VERSION: "2025.3.3"
    steps:
      - name: Clone target repo
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.prepare.outputs.repo_full }}
          ref: ${{ needs.prepare.outputs.ref }}
          fetch-depth: 0

      - name: Download & Install oneAPI
        shell: bash
        run: |
          scripts/install-oneapi.bat $WINDOWS_BASEKIT_URL $WINDOWS_DPCPP_MKL

      - name: Install Level Zero SDK
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "${{ env.LEVEL_ZERO_SDK_URL }}" -OutFile "level-zero-win-sdk.zip"
          Expand-Archive -Path "level-zero-win-sdk.zip" -DestinationPath "C:/level-zero-sdk" -Force
          "LEVEL_ZERO_V1_SDK_PATH=C:/level-zero-sdk" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: prebuilt-windows-sycl-${{ needs.prepare.outputs.ref }}
          max-size: 2G

      - name: Build
        shell: cmd
        run: |
          call "C:\Program Files (x86)\Intel\oneAPI\setvars.bat" intel64 --force
          cmake -G "Ninja" -B build ^
            -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=icx ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DGGML_BACKEND_DL=ON -DBUILD_SHARED_LIBS=ON ^
            -DGGML_CPU=OFF -DGGML_SYCL=ON ^
            ${{ env.CMAKE_ARGS }}
          cmake --build build --target ggml-sycl -j %NUMBER_OF_PROCESSORS%

      - name: ccache-clear
        if: always()
        uses: ggml-org/llama.cpp/.github/actions/ccache-clear@${{ env.LLAMA_CPP_ACTIONS_REF }}
        with:
          key: prebuilt-windows-sycl-${{ needs.prepare.outputs.ref }}

      - name: Pack artifacts
        run: |
          cp "${{ env.ONEAPI_ROOT }}/mkl/latest/bin/mkl_sycl_blas.5.dll" ./build/bin
          cp "${{ env.ONEAPI_ROOT }}/mkl/latest/bin/mkl_core.2.dll" ./build/bin
          cp "${{ env.ONEAPI_ROOT }}/mkl/latest/bin/mkl_tbb_thread.2.dll" ./build/bin
          cp "${{ env.ONEAPI_ROOT }}/compiler/latest/bin/ur_adapter_level_zero.dll" ./build/bin
          cp "${{ env.ONEAPI_ROOT }}/compiler/latest/bin/ur_adapter_level_zero_v2.dll" ./build/bin
          cp "${{ env.ONEAPI_ROOT }}/compiler/latest/bin/ur_adapter_opencl.dll" ./build/bin
          cp "${{ env.ONEAPI_ROOT }}/compiler/latest/bin/ur_loader.dll" ./build/bin
          cp "${{ env.ONEAPI_ROOT }}/compiler/latest/bin/ur_win_proxy_loader.dll" ./build/bin
          $ZE_LOADER_DLL=$(find "${{ env.ONEAPI_ROOT }}" "$env:LEVEL_ZERO_V1_SDK_PATH" -iname ze_loader.dll -print -quit 2>/dev/null || true)
          if ($ZE_LOADER_DLL) { cp "$ZE_LOADER_DLL" ./build/bin }
          cp "${{ env.ONEAPI_ROOT }}/compiler/latest/bin/sycl8.dll" ./build/bin
          cp "${{ env.ONEAPI_ROOT }}/compiler/latest/bin/svml_dispmd.dll" ./build/bin
          cp "${{ env.ONEAPI_ROOT }}/compiler/latest/bin/libmmd.dll" ./build/bin
          cp "${{ env.ONEAPI_ROOT }}/compiler/latest/bin/libiomp5md.dll" ./build/bin
          cp "${{ env.ONEAPI_ROOT }}/compiler/latest/bin/sycl-ls.exe" ./build/bin
          cp "${{ env.ONEAPI_ROOT }}/compiler/latest/bin/libsycl-fallback-bfloat16.spv" ./build/bin
          cp "${{ env.ONEAPI_ROOT }}/compiler/latest/bin/libsycl-native-bfloat16.spv" ./build/bin
          cp "${{ env.ONEAPI_ROOT }}/dnnl/latest/bin/dnnl.dll" ./build/bin
          cp "${{ env.ONEAPI_ROOT }}/tbb/latest/bin/tbb12.dll" ./build/bin
          cp "${{ env.ONEAPI_ROOT }}/tcm/latest/bin/tcm.dll" ./build/bin
          cp "${{ env.ONEAPI_ROOT }}/tcm/latest/bin/libhwloc-15.dll" ./build/bin
          cp "${{ env.ONEAPI_ROOT }}/umf/latest/bin/umf.dll" ./build/bin
          7z a -snl ${{ needs.prepare.outputs.repo_name }}-${{ needs.prepare.outputs.tag_name }}-bin-win-sycl-x64.zip ./build/bin/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.prepare.outputs.repo_name }}-bin-win-sycl-x64.zip
          path: ${{ needs.prepare.outputs.repo_name }}-${{ needs.prepare.outputs.tag_name }}-bin-win-sycl-x64.zip

  # ═══════════════════════════════════════════
  # 14. Windows OpenVINO 编译（x64）
  # ═══════════════════════════════════════════
  windows-openvino:
    needs: prepare
    if: ${{ contains(needs.prepare.outputs.platforms, 'windows') && needs.prepare.outputs.backends_openvino == 'true' && needs.prepare.outputs.arch_x64 == 'true' }}
    runs-on: windows-2022
    permissions:
      actions: write
    env:
      CMAKE_ARGS: ${{ github.event.inputs.cmake_args }}
      OPENVINO_VERSION_MAJOR: "2026.2.1"
      OPENVINO_VERSION_FULL: "2026.2.1.21919.ede283a88e3"
    steps:
      - name: Clone target repo
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.prepare.outputs.repo_full }}
          ref: ${{ needs.prepare.outputs.ref }}
          fetch-depth: 0

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: prebuilt-windows-openvino-${{ needs.prepare.outputs.ref }}
          max-size: 2G

      - name: Setup Cache
        uses: actions/cache@v5
        id: cache-openvino
        with:
          path: ./openvino_toolkit
          key: cache-gha-openvino-toolkit-v${{ env.OPENVINO_VERSION_FULL }}-${{ runner.os }}

      - name: Setup OpenVINO Toolkit
        if: steps.cache-openvino.outputs.cache-hit != 'true'
        uses: ggml-org/llama.cpp/.github/actions/windows-setup-openvino@${{ env.LLAMA_CPP_ACTIONS_REF }}
        with:
          path: ./openvino_toolkit
          version_major: ${{ env.OPENVINO_VERSION_MAJOR }}
          version_full: ${{ env.OPENVINO_VERSION_FULL }}

      - name: Install OpenCL using vcpkg
        shell: powershell
        run: |
          git clone https://github.com/microsoft/vcpkg C:\vcpkg
          C:\vcpkg\bootstrap-vcpkg.bat
          C:\vcpkg\vcpkg install opencl

      - name: Build
        id: cmake_build
        shell: cmd
        run: |
          for /d %%i in (openvino_toolkit\*) do set OPENVINO_ROOT=%%i
          if not exist "%OPENVINO_ROOT%\runtime\cmake\OpenVINOConfig.cmake" (
              echo ERROR: OpenVINOConfig.cmake not found
              exit /b 1
          )
          call "%OPENVINO_ROOT%\setupvars.bat"
          cmake -B build\ReleaseOV -G "Visual Studio 17 2022" ^
            -A x64 ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DGGML_OPENVINO=ON ^
            -DCMAKE_TOOLCHAIN_FILE=C:\vcpkg\scripts\buildsystems\vcpkg.cmake ^
            ${{ env.CMAKE_ARGS }}
          cmake --build build\ReleaseOV --config Release -- /m

      - name: ccache-clear
        if: always()
        uses: ggml-org/llama.cpp/.github/actions/ccache-clear@${{ env.LLAMA_CPP_ACTIONS_REF }}
        with:
          key: prebuilt-windows-openvino-${{ needs.prepare.outputs.ref }}

      - name: Pack artifacts
        shell: powershell
        run: |
          $OPENVINO_ROOT = (Get-ChildItem -Directory openvino_toolkit | Select-Object -First 1).FullName
          if (-not $OPENVINO_ROOT) { Write-Error "OpenVINO toolkit folder not found"; exit 1 }
          $dest = ".\build\ReleaseOV\bin\Release"
          $ovBin = Join-Path $OPENVINO_ROOT 'runtime\bin\intel64\Release'
          Copy-Item -Path (Join-Path $ovBin '*.dll') -Destination $dest -Force
          Copy-Item -Path (Join-Path $ovBin 'cache.json') -Destination $dest -Force
          $tbbBin = Join-Path $OPENVINO_ROOT 'runtime\3rdparty\tbb\bin'
          Copy-Item -Path (Join-Path $tbbBin 'tbb*.dll') -Destination $dest -Force
          $licensingDest = Join-Path $dest 'openvino-licensing'
          New-Item -ItemType Directory -Force -Path $licensingDest | Out-Null
          Copy-Item -Path (Join-Path $OPENVINO_ROOT 'docs\licensing\*') -Destination $licensingDest -Recurse -Force
          Copy-Item LICENSE $dest
          7z a -snl ${{ needs.prepare.outputs.repo_name }}-${{ needs.prepare.outputs.tag_name }}-bin-win-openvino-${{ env.OPENVINO_VERSION_MAJOR }}-x64.zip $dest\*

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.prepare.outputs.repo_name }}-bin-win-openvino-${{ env.OPENVINO_VERSION_MAJOR }}-x64.zip
          path: ${{ needs.prepare.outputs.repo_name }}-${{ needs.prepare.outputs.tag_name }}-bin-win-openvino-${{ env.OPENVINO_VERSION_MAJOR }}-x64.zip

  # ═══════════════════════════════════════════
  # 15. 汇总 & 创建 Release
  # ═══════════════════════════════════════════
  release:
    needs:
      - prepare
      - macos
      - linux-cpu
      - linux-vulkan
      - linux-rocm
      - linux-sycl
      - linux-openvino
      - android
      - windows-cpu
      - windows-cuda
      - windows-vulkan
      - windows-hip
      - windows-sycl
      - windows-openvino
    if: ${{ always() && needs.prepare.result == 'success' && needs.prepare.outputs.create_release == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
          merge-multiple: true

      - name: Organize release files
        run: |
          mkdir -p release
          # 合并 Windows CPU 后端到同架构 GPU zip（与官方 release 一致）
          for arch in x64 arm64; do
            cpu_zip=$(ls artifacts/*-win-cpu-${arch}.zip 2>/dev/null | head -1)
            if [ -n "$cpu_zip" ]; then
              temp_dir=$(mktemp -d)
              unzip -q "$cpu_zip" -d "$temp_dir"
              for target_zip in artifacts/*-win-*-${arch}.zip; do
                if [ "$target_zip" = "$cpu_zip" ]; then continue; fi
                (cd "$temp_dir" && zip -q -r "$(realpath "$target_zip")" .)
              done
              rm -rf "$temp_dir"
            fi
          done
          mv artifacts/*.zip release/ 2>/dev/null || true
          mv artifacts/*.tar.gz release/ 2>/dev/null || true
          ls -lh release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag_name }}
          name: "Prebuilt ${{ needs.prepare.outputs.tag_name }}"
          body: |
            自动预编译产物
            - 源仓库: `${{ needs.prepare.outputs.repo_url }}`
            - 分支/Ref: `${{ needs.prepare.outputs.ref }}`
            - PR 编号: `${{ needs.prepare.outputs.pr_display }}`
            - 编译平台: `${{ github.event.inputs.platforms }}`
            - 编译架构: `${{ github.event.inputs.archs }}`
            - 编译后端: `${{ github.event.inputs.backends }}`
          files: release/*
          draft: false
          prerelease: ${{ needs.prepare.outputs.is_pr == 'true' }}
